name: Deploy Botmother to Telegram Serverless

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Telegram Serverless project
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure pool encryption
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          POOL_ENCRYPTION_KEY: ${{ secrets.POOL_ENCRYPTION_KEY }}
        run: npm run configure:serverless

      - name: Run database migrations
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --yes

      - name: Deploy modules and Mini App
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          POOL_ENCRYPTION_KEY: ${{ secrets.POOL_ENCRYPTION_KEY }}
        run: npx tgcloud push

      - name: Sync Telegram webhook
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud webhook sync
